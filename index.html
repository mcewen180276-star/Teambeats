const KEY='teambeats-planner-v1';const defaults={equipment:['Bodyweight','Dumbbells','Kettlebells','Exercise mat'],quantities:{},customEquipment:[],customExercises:[],saved:[],current:null,config:{title:'My TEAMBEATS class',duration:45,format:'mixed',focus:'Balanced',level:'Mixed abilities',participants:12,stations:6,work:40,rest:20,rounds:2,warmup:6,cooldown:5,method:'Intervals',maxRepeat:2},activeTab:'plan'};
let state;try{state={...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{state=structuredClone(defaults)};let clock={seconds:0,running:false,index:0,handle:null};const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(state))}function allEquipment(){return Object.values(GROUPS).flat().concat(state.customEquipment)}function allExercises(){return starter.concat(state.customExercises)}function compatible(e){return e.equipment.every(x=>state.equipment.includes(x))}function tab(t){state.activeTab=t;save();document.querySelectorAll('.tab').forEach(el=>el.classList.toggle('hide',el.id!==t));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render(t)}function nav(){ $('nav').innerHTML=[['plan','⚡ Plan'],['equipment','🏋️ Equipment'],['library','📚 Exercises'],['saved','💾 Saved'],['timer','⏱️ Timer'],['settings','⚙️ Data']].map(([id,name])=>`<button data-tab="${id}" onclick="tab('${id}')">${name}</button>`).join('')}
function render(t){({plan:renderPlan,equipment:renderEquipment,library:renderLibrary,saved:renderSaved,timer:renderTimer,settings:renderSettings})[t]();nav()}
function renderEquipment(){let html=`<div class="panel"><h2>Equipment available for your classes</h2><p>Select the kit you actually have. Generator excludes exercises requiring unselected equipment. Set quantity for station planning.</p><div class="row noprint"><button onclick="state.equipment=allEquipment();save();renderEquipment()">Select all</button><button class="secondary" onclick="state.equipment=['Bodyweight'];save();renderEquipment()">Bodyweight only</button><button class="secondary" onclick="state.equipment=[];save();renderEquipment()">Clear</button></div>`;for(const [group,items] of Object.entries({...GROUPS,'My custom equipment':state.customEquipment})){html+=`<details open><summary>${esc(group)} (${items.filter(x=>state.equipment.includes(x)).length}/${items.length})</summary><div class="checkgrid">${items.map(x=>`<label><input type="checkbox" ${state.equipment.includes(x)?'checked':''} onchange="toggleEquipment('${esc(x).replace(/'/g,'&#39;')}',this.checked)"> ${esc(x)} <input aria-label="Quantity of ${esc(x)}" type="number" min="0" placeholder="Qty" value="${state.quantities[x]??''}" style="width:75px;margin-top:5px" onchange="state.quantities[${JSON.stringify(x)}]=Math.max(0,+this.value||0);save()"></label>`).join('')}</div></details>`}html+=`<div class="grid"><div><label>➕ Add your own equipment</label><input id="newKit" placeholder="e.g. Weighted vest"></div><div style="align-self:end"><button onclick="addEquipment()">Add equipment</button></div></div><p class="muted">Equipment quantities are used to flag potential bottlenecks; check actual room layout and participant ability.</p></div>`;$('equipment').innerHTML=html}
function toggleEquipment(x,on){state.equipment=on?[...new Set([...state.equipment,x])]:state.equipment.filter(y=>y!==x);save();renderEquipment()}function addEquipment(){let x=$('newKit').value.trim();if(!x)return;if(!allEquipment().some(y=>y.toLowerCase()===x.toLowerCase()))state.customEquipment.push(x);state.equipment=[...new Set([...state.equipment,x])];save();renderEquipment()}
function configField(key,value){state.config[key]=value;save()};function renderPlan(){let c=state.config;let opts=(a,v)=>a.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');$('plan').classList.toggle('printable',true);$('plan').innerHTML=`<div class="panel noprint"><h2>Build your class</h2><div class="grid"><div><label>Class name</label><input value="${esc(c.title)}" onchange="configField('title',this.value)"></div><div><label>Duration (minutes)</label><input type="number" min="15" max="120" value="${c.duration}" onchange="configField('duration',+this.value)"></div><div><label>Format</label><select onchange="configField('format',this.value)">${opts(['mixed','stations','everyone together'],c.format)}</select></div><div><label>Focus</label><select onchange="configField('focus',this.value)">${opts(['Balanced','Cardio','Strength','Core','Functional','Mobility'],c.focus)}</select></div><div><label>Ability</label><select onchange="configField('level',this.value)">${opts(['Mixed abilities','Beginner','Intermediate','Advanced'],c.level)}</select></div><div><label>Participants</label><input type="number" min="1" max="100" value="${c.participants}" onchange="configField('participants',+this.value)"></div><div><label>Stations (for circuits)</label><input type="number" min="1" max="30" value="${c.stations}" onchange="configField('stations',+this.value)"></div><div><label>Work (seconds)</label><input type="number" min="10" max="600" value="${c.work}" onchange="configField('work',+this.value)"></div><div><label>Rest/transition (seconds)</label><input type="number" min="0" max="300" value="${c.rest}" onchange="configField('rest',+this.value)"></div><div><label>Rounds</label><input type="number" min="1" max="20" value="${c.rounds}" onchange="configField('rounds',+this.value)"></div><div><label>Warm-up (minutes)</label><input type="number" min="0" max="30" value="${c.warmup}" onchange="configField('warmup',+this.value)"></div><div><label>Cooldown (minutes)</label><input type="number" min="0" max="30" value="${c.cooldown}" onchange="configField('cooldown',+this.value)"></div><div><label>Workout style</label><select onchange="configField('method',this.value)">${opts(['Intervals','HIIT','EMOM','AMRAP','Pyramid'],c.method)}</select></div><div><label>Max exercise repeats</label><input type="number" min="1" max="10" value="${c.maxRepeat}" onchange="configField('maxRepeat',+this.value)"></div></div><p class="muted">${state.equipment.length} equipment types selected. <a href="#" onclick="tab('equipment');return false">Change equipment</a></p><div class="row"><button onclick="generate()">✨ Generate class</button><button class="secondary" onclick="saveCurrent()">Save class</button><button class="secondary" onclick="window.print()">Print / PDF</button></div><p id="genMsg" role="status"></p></div><div id="classOutput">${classHTML(state.current)}</div>`}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function pick(pool,n,used={},max=2){let out=[];let candidates=shuffle(pool);for(let i=0;i<n;i++){let available=candidates.filter(x=>(used[x.id]||0)<max);if(!available.length)break;let e=available[i%available.length];out.push(e);used[e.id]=(used[e.id]||0)+1}return out}
function generate(){let c=state.config;let dur=Math.max(15,Math.min(120,+c.duration||45)),wu=Math.max(0,+c.warmup||0),cd=Math.max(0,+c.cooldown||0);if(wu+cd>=dur){$('genMsg').textContent='Warm-up and cooldown must total less than class duration.';return}let pool=allExercises().filter(compatible);if(pool.length<3){$('genMsg').textContent='Choose more equipment (Bodyweight is recommended) or add exercises.';return}let mainSecs=(dur-wu-cd)*60,work=Math.max(10,+c.work||40),rest=Math.max(0,+c.rest||0),requested=Math.max(1,+c.rounds||1);let stationCount=c.format==='everyone together'?Math.max(3,Math.min(12,Math.floor(mainSecs/(work+rest)/requested))):Math.max(1,Math.min(30,+c.stations||6));let cycles=Math.max(1,Math.floor(mainSecs/((work+rest)*stationCount)));let focus=c.focus;let priority=pool.filter(x=>focus==='Balanced'||x.category===focus||(focus==='Functional'&&x.category==='Cardio'));let selected=pick(priority,stationCount,{},Math.max(1,+c.maxRepeat||2));if(selected.length<stationCount)selected.push(...pick(pool,stationCount-selected.length,{},Math.max(1,+c.maxRepeat||2)));if(!selected.length){$('genMsg').textContent='No matching exercises found.';return}let warm=pick(pool.filter(x=>x.category==='Cardio'||x.category==='Mobility'),Math.max(1,Math.ceil(wu/2)));let cool=pick(pool.filter(x=>x.category==='Mobility'),Math.max(1,Math.ceil(cd/2)));let intervalCount=cycles*selected.length;let actualMain=intervalCount*(work+rest),extra=mainSecs-actualMain;let warnings=[];if(extra>0)warnings.push(`${Math.ceil(extra/60)} minute(s) unallocated: use for demos, hydration or transitions.`);if(c.format!=='everyone together'){let groupSize=Math.ceil((+c.participants||1)/selected.length);let shortages=selected.filter(e=>e.equipment.some(k=>k!=='Bodyweight'&&state.quantities[k]>0&&state.quantities[k]<groupSize));if(shortages.length)warnings.push(`Check equipment capacity for ${groupSize} participants/station: ${shortages.map(e=>e.name).join(', ')}.`)}if(c.method!=='Intervals'&&c.method!=='HIIT')warnings.push(`${c.method} selected: adapt the timed blocks to your coaching method; this plan uses the work/rest timer as a practical baseline.`);state.current={id:Date.now(),title:c.title,created:new Date().toLocaleString(),config:{...c,duration:dur},warm,cool,main:selected,cycles,work,rest,extra,warnings};save();renderPlan();$('genMsg').textContent='Class generated.'}
function exerciseHTML(e,i){return `<div class="item"><div class="row between"><strong>${i+1}. ${esc(e.name)}</strong><span class="pill">${esc(e.category)}</span></div><small>Equipment: ${esc(e.equipment.join(', '))}</small><p>${esc(e.instructions)}</p><small>Alternative: ${esc(e.alternative||'Adjust range and intensity')}</small> · <a target="_blank" rel="noopener" href="${esc(e.sourceUrl||'https://www.youtube.com/results?search_query='+encodeURIComponent(e.name+' exercise technique'))}">Technique link ↗</a></div>`}
function classHTML(p){if(!p)return `<div class="panel"><h2>Your class will appear here</h2><p>Choose equipment, set class options, then generate your first session.</p></div>`;let c=p.config;return `<div class="panel printable"><div class="row between"><h2>${esc(p.title)}</h2><span class="pill">${esc(c.duration)} minutes</span></div><p>${esc(c.format)} • ${esc(c.focus)} • ${esc(c.level)} • ${esc(c.participants)} participants • ${esc(c.method)}</p><p><strong>Heart-rate coaching:</strong> warm-up at comfortable effort; main block progresses from moderate to vigorous effort as appropriate; cooldown returns to easy effort. Individual HR targets require personal assessment and suitable monitoring.</p><h3>Warm-up — ${esc(c.warmup)} min</h3>${p.warm.map(exerciseHTML).join('')}<h3>Main block — ${p.main.length} ${c.format==='everyone together'?'movements':'stations'} × ${p.cycles} rounds</h3><p>Work ${p.work}s • rest/transition ${p.rest}s • approx. ${Math.round(p.main.length*p.cycles*(p.work+p.rest)/60)} min</p>${p.main.map(exerciseHTML).join('')}<h3>Cooldown — ${esc(c.cooldown)} min</h3>${p.cool.map(exerciseHTML).join('')}<h3>Equipment checklist</h3><p>${esc([...new Set([...p.main,...p.warm,...p.cool].flatMap(e=>e.equipment))].join(' • '))}</p>${p.warnings.length?`<h3>Instructor notes</h3><p>${p.warnings.map(esc).join('<br>')}</p>`:''}<p class="muted">Plan generated ${esc(p.created)}. Instructor should verify suitability, timings, safety and available equipment.</p><div class="row noprint"><button onclick="saveCurrent()">💾 Save this plan</button><button class="secondary" onclick="loadTimer();tab('timer')">⏱️ Open timer</button><button class="secondary" onclick="window.print()">🖨️ Print</button></div></div>`}
function saveCurrent(){if(!state.current){alert('Generate a class first.');return}state.saved.unshift(JSON.parse(JSON.stringify({...state.current,id:Date.now()})));save();alert('Class saved on this device.')}
function renderLibrary(){let search=window.libQuery||'';let cat=window.libCategory||'All';let arr=allExercises().filter(e=>(cat==='All'||e.category===cat)&&((window.libMuscle||'All')==='All'||(e.muscle||'Full body')===(window.libMuscle||'All'))&&((window.libKit||'All')==='All'||e.equipment.includes(window.libKit))&&(`${e.name} ${e.equipment.join(' ')} ${e.instructions}`).toLowerCase().includes(search.toLowerCase()));$('library').innerHTML=`<div class="panel"><h2>Exercise library <span class="pill">${allExercises().length} exercises</span></h2><div class="grid"><div><label>Search exercise or equipment</label><input value="${esc(search)}" oninput="window.libQuery=this.value;renderLibrary()" placeholder="Search..."></div><div><label>Muscle group</label><select onchange="window.libMuscle=this.value;renderLibrary()">${['All','Full body','Legs','Glutes','Chest','Back','Shoulders','Arms','Core','Mobility'].map(x=>`<option ${((window.libMuscle||'All')===x)?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Equipment filter</label><select onchange="window.libKit=this.value;renderLibrary()">${['All',...allEquipment()].map(x=>`<option ${((window.libKit||'All')===x)?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div><label>Category</label><select onchange="window.libCategory=this.value;renderLibrary()">${['All','Cardio','Strength','Core','Functional','Mobility'].map(x=>`<option ${cat===x?'selected':''}>${x}</option>`).join('')}</select></div></div><p>${arr.length} results • ${arr.filter(compatible).length} match your equipment</p>${arr.slice(0,120).map((e,i)=>exerciseHTML(e,i)).join('')}<h3>➕ Add exercise</h3><p>Search online by exercise name, review the result, or add your own. Online search requires internet.</p><div class="grid"><div><label>Find exercise online</label><input id="onlineTerm" placeholder="e.g. squat, row, lunge"></div><div style="align-self:end"><button onclick="searchOnlineExercise()">🔎 Search & add</button></div></div><div id="onlineResults" role="status"></div><h3>Manual exercise details</h3><div class="grid"><div><label>Name</label><input id="exName"></div><div><label>Category</label><select id="exCat">${['Cardio','Strength','Core','Functional','Mobility'].map(x=>`<option>${x}</option>`).join('')}</select></div><div><label>Muscle group</label><select id="exMuscle">${["Full body","Legs","Glutes","Chest","Back","Shoulders","Arms","Core","Mobility"].map(x=>`<option>${x}</option>`).join('')}</select></div><div><label>Alternative</label><input id="exAlt"></div></div><label>Equipment needed (select all that apply)</label><div class="checkgrid">${allEquipment().map(x=>`<label><input type="checkbox" class="exKitChoice" value="${esc(x)}"> ${esc(x)}</label>`).join('')}</div><label>Technique instructions</label><textarea id="exInstructions" rows="3"></textarea><label>Technique / video link (optional)</label><input id="exLink" type="url" placeholder="https://..."><button onclick="addExercise()">Add exercise</button></div>`}
function addExercise(){let name=$('exName').value.trim(),instructions=$('exInstructions').value.trim();if(!name||!instructions){alert('Add name and instructions.');return}state.customExercises.push({id:'custom'+Date.now(),name,category:$('exCat').value,equipment:[...document.querySelectorAll('.exKitChoice:checked')].map(x=>x.value).length?[...document.querySelectorAll('.exKitChoice:checked')].map(x=>x.value):['Bodyweight'],muscle:$('exMuscle').value,sourceUrl:$('exLink').value.trim(),instructions,alternative:$('exAlt').value});save();renderLibrary()}
function renderSaved(){$('saved').innerHTML=`<div class="panel"><h2>Saved classes (${state.saved.length})</h2>${state.saved.length?state.saved.map((p,i)=>`<div class="item"><strong>${esc(p.title)}</strong><p>${esc(p.created)} • ${p.config.duration} min • ${esc(p.config.format)}</p><div class="row"><button onclick="openSaved(${i})">Open</button><button class="secondary" onclick="duplicateSaved(${i})">Duplicate</button><button class="danger" onclick="deleteSaved(${i})">Delete</button></div></div>`).join(''):'<p>No saved classes yet.</p>'}</div>`}function openSaved(i){state.current=JSON.parse(JSON.stringify(state.saved[i]));save();tab('plan')}function duplicateSaved(i){state.saved.unshift({...JSON.parse(JSON.stringify(state.saved[i])),id:Date.now(),title:state.saved[i].title+' (copy)'});save();renderSaved()}function deleteSaved(i){if(confirm('Delete this saved class?')){state.saved.splice(i,1);save();renderSaved()}}
function timerStages(){let p=state.current;if(!p)return[];let stages=[];for(let r=0;r<p.cycles;r++)for(const e of p.main){stages.push({label:`Round ${r+1}: ${e.name}`,seconds:p.work});if(p.rest)stages.push({label:'Rest / change station',seconds:p.rest})}return stages}function loadTimer(){clock.running=false;clearInterval(clock.handle);clock.index=0;clock.seconds=timerStages()[0]?.seconds||0}function formatTime(s){return `${Math.floor(Math.max(0,s)/60).toString().padStart(2,'0')}:${(Math.max(0,s)%60).toString().padStart(2,'0')}`}function renderTimer(){let stages=timerStages();$('timer').innerHTML=`<div class="panel"><h2>Instructor interval timer</h2><p>${state.current?esc(state.current.title):'Generate or open a class first.'}</p><p id="stageLabel" style="text-align:center">${esc(stages[clock.index]?.label||'No class loaded')}</p><div class="timer" id="clockDisplay">${formatTime(clock.seconds)}</div><p id="timerProgress" style="text-align:center">Block ${Math.min(clock.index+1,stages.length)} of ${stages.length}</p><div class="row" style="justify-content:center"><button onclick="toggleTimer()">${clock.running?'Pause':'Start'}</button><button class="secondary" onclick="nextStage()">Skip</button><button class="secondary" onclick="loadTimer();renderTimer()">Reset</button></div><p class="muted">Keep this tab open while timing. Browser background throttling and phone sleep can affect alerts; use a dedicated timer when exact timing is critical.</p></div>`}function tick(){if(!clock.running)return;clock.seconds--;if(clock.seconds<=0){try{navigator.vibrate?.(160)}catch{};nextStage(true)}else updateTimer()}function updateTimer(){if($('clockDisplay'))$('clockDisplay').textContent=formatTime(clock.seconds);if($('stageLabel'))$('stageLabel').textContent=timerStages()[clock.index]?.label||'Complete';if($('timerProgress'))$('timerProgress').textContent=`Block ${Math.min(clock.index+1,timerStages().length)} of ${timerStages().length}`}function toggleTimer(){if(!timerStages().length)return;clock.running=!clock.running;clearInterval(clock.handle);if(clock.running){if(clock.seconds<=0)clock.seconds=timerStages()[clock.index]?.seconds||0;clock.handle=setInterval(tick,1000)}renderTimer()}function nextStage(auto=false){clock.index++;let stages=timerStages();if(clock.index>=stages.length){clock.running=false;clearInterval(clock.handle);clock.seconds=0;renderTimer();return}clock.seconds=stages[clock.index].seconds;if(!auto)renderTimer();else updateTimer()}

async function searchOnlineExercise(){const term=$('onlineTerm').value.trim(),out=$('onlineResults');if(!term){out.textContent='Enter an exercise name first.';return}out.textContent='Searching wger exercise database…';try{const response=await fetch('https://wger.de/api/v2/exercise/search/?term='+encodeURIComponent(term));if(!response.ok)throw Error('Online service unavailable');const data=await response.json();const hits=(data.suggestions||data.results||[]).slice(0,12);if(!hits.length){out.textContent='No matching exercises. Try another term or add manually.';return}window.onlineHits=hits;out.innerHTML='<h3>Results — tap to review and add</h3>'+hits.map((hit,i)=>`<div class="item"><strong>${esc(hit.value||hit.name||hit.data?.name||'Exercise')}</strong> <button class="secondary" onclick="reviewOnline(${i})">Review</button></div>`).join('')}catch(err){out.innerHTML='<p class="error">Could not search online. Check internet access or try manual entry.</p><a target="_blank" rel="noopener" href="https://wger.de/en/exercise/overview/">Browse wger exercises</a>'}}
function reviewOnline(i){const hit=window.onlineHits?.[i];if(!hit)return;const name=hit.value||hit.name||hit.data?.name||'';$('exName').value=name;const d=hit.data||{};const category=(d.category?.name||d.category||'').toString().toLowerCase();$('exCat').value=category.includes('cardio')?'Cardio':category.includes('strength')?'Strength':'Functional';$('exInstructions').value=(d.description||'').replace(/<[^>]*>/g,' ').trim();$('exLink').value='https://wger.de/en/exercise/overview/';$('exName').scrollIntoView({behavior:'smooth',block:'center'});$('onlineResults').insertAdjacentHTML('beforeend','<p class="success">Result copied into the form. Check instructions and equipment, then tap Add exercise.</p>')}

function renderSettings(){$('settings').innerHTML=`<div class="panel"><h2>Backup and restore</h2><p>All saved classes and settings live in this browser on this device. Back up regularly, especially before clearing browser data or reinstalling.</p><div class="row"><button onclick="exportData()">⬇ Export backup JSON</button><label class="btn secondary" style="margin:0">⬆ Import backup<input type="file" accept="application/json" style="display:none" onchange="importData(this.files[0])"></label></div><h3>Reset</h3><button class="danger" onclick="resetData()">Delete all local app data</button><h3>Install</h3><p>On Android Chrome, open the published HTTPS site and choose menu → Install app or Add to Home screen. Installation depends on browser support and hosting.</p><button id="installBtn" class="secondary hide" onclick="installApp()">Install app</button><p class="muted">No account, no paid services, no live music streaming or hardware connection. Technique links open external YouTube search results and require internet.</p></div>`;if(window.installPrompt)$('installBtn').classList.remove('hide')}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='teambeats-planner-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}async function importData(f){if(!f)return;try{let data=JSON.parse(await f.text());if(!Array.isArray(data.saved)||!Array.isArray(data.equipment)||!data.config)throw Error('Not a valid planner backup');if(!confirm('Replace current app data with this backup?'))return;state={...defaults,...data};save();tab('plan')}catch(e){alert('Import failed: '+e.message)}}function resetData(){if(confirm('Permanently clear all saved classes, exercises and settings on this device?')){localStorage.removeItem(KEY);location.reload()}}window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();window.installPrompt=e;if(state.activeTab==='settings')renderSettings()});async function installApp(){if(window.installPrompt){await window.installPrompt.prompt();window.installPrompt=null;renderSettings()}}if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});tab(state.activeTab||'plan');
</script></body></html>
